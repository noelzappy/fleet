# fleet.yaml — per-project contract for the fleet CLI. Copy, edit, commit.
# Secrets never go in this file: reference them as ${VAR} and put the values in
# ~/.config/fleet/env on the fleet box.
version: 1

project:
  name: widgets                 # used for the default root and the systemd unit description
  repo: your-org/widgets        # owner/name on GitHub
  branch: main
  root: ~/fleet/widgets         # the orchestrator's clone; worktrees are created beside it
  docs: docs                    # governance docs agents are pointed at

machine:                        # the box is Linux (Ubuntu 24.04) or macOS; bootstrap picks the steps by OS
  node: "24"
  pnpm: "11"
  docker: true
  tailscale: true               # false when running locally with dashboard_bind 127.0.0.1
  firewall: true                # ufw deny-incoming + SSH key-only auth
  always_on: true               # dedicated box; on macOS bootstrap disables sleep
  turbo_remote:                 # optional; omit if the repo doesn't use Turborepo
    token_env: TURBO_TOKEN
    team: your-team

# Harnesses are the agent CLIs. Several profiles can share one harness.
# min_version: harness add/verify/update refuse anything older. Floors as of 2026-09-16:
#   claude-code 2.1.163  GHSA-7835-87q9-rgvv (sandbox escape), GHSA-fg94-h982-f3mm (WebFetch exfiltration)
#   opencode    1.1.10   GHSA-c83v-7274-4vgp (web UI XSS -> command execution), GHSA-vxw4-wv6m-9hhh
#   antigravity 1.1.28   no published advisories; first release whose -p runs don't hang on plan approval
#   codex       0.39.0   GHSA-w5fx-fh39-j5rw (sandbox bypass); also covers GHSA-xrxf-jgv3-qmrm (MCP config, <= 0.23.0)
# auth_check (optional) overrides how fleet tells a harness is signed in; signed-out harnesses get no new work.
# Re-check advisories when you run `fleet harness update` (weekly).
harnesses:
  claude-code:
    kind: claude-code
    min_version: 2.1.163
    install: npm i -g @anthropic-ai/claude-code
    login: claude login
    smoke: cd /tmp && claude -p "print OK and exit" --output-format text | tail -1 | grep -q OK
  antigravity:                  # Antigravity CLI (agy) — replaced Gemini CLI; uses your Google AI subscription
    kind: antigravity
    min_version: 1.1.28
    install: curl -fsSL https://antigravity.google/cli/install.sh | bash
    login: agy                  # first interactive run signs in; over SSH it prints a URL, paste the code back
    smoke: cd /tmp && agy -p "Reply with exactly OK" --output-format text | tail -1 | grep -q OK
  codex:                        # OpenAI Codex CLI — uses your ChatGPT plan
    kind: codex
    min_version: 0.39.0
    install: npm i -g @openai/codex
    login: codex login --device-auth
    smoke: cd /tmp && codex exec --skip-git-repo-check --ephemeral "Reply with exactly OK and nothing else." | tail -1 | grep -q OK
  opencode:                     # every other model (DeepSeek, GLM, free models) through OpenCode Zen or your own provider keys
    kind: opencode
    min_version: 1.1.10
    install: npm i -g opencode-ai
    login: opencode auth login
    smoke: cd /tmp && opencode run "Reply with exactly OK and nothing else." | tail -1 | grep -q OK

# Profiles = harness + model + role. Profile names appear in PR bodies.
# vendor is the model's maker, not the gateway (opencode/glm-5.3 is vendor zai). With
# cross_vendor_review on, each implementer vendor needs a reviewer from a different vendor.
# Model ids: `claude --help`, `agy models`, `opencode models`, `codex debug models`. Omit model to use the CLI's default.
profiles:
  impl-sonnet:   { harness: claude-code, model: claude-sonnet-5,       role: implementer, vendor: anthropic, concurrency: 2, waves: [backend, notifications, mobile] }
  impl-gemini:   { harness: antigravity, model: gemini-3.1-pro-high,   role: implementer, vendor: google,    concurrency: 2, waves: [contracts, ui, admin, mobile] }
  impl-glm:      { harness: opencode,    model: opencode/glm-5.3,         role: implementer, vendor: zai,       concurrency: 1, waves: [contracts, admin] }
  impl-codex:    { harness: codex,                                        role: implementer, vendor: openai,    concurrency: 1, waves: [backend, ui] }
  impl-deepseek: { harness: opencode,    model: opencode/deepseek-v4-pro, role: implementer, vendor: deepseek,  concurrency: 1, waves: [backend] }
  review-opus:   { harness: claude-code, model: claude-opus-5,         role: reviewer,    vendor: anthropic, concurrency: 1, waves: [] }
  review-gemini: { harness: antigravity, model: gemini-3.1-pro-high,   role: reviewer,    vendor: google,    concurrency: 1, waves: [] }
  fix-flash:     { harness: antigravity, model: gemini-3.8-flash-medium, role: fixer,       vendor: google,    concurrency: 2, waves: [] }

# Ordered: dispatch priority follows this list, then issue number.
# Each becomes a wave:<name> label.
waves:
  - { name: contracts }
  - { name: ui }
  - { name: admin }
  - { name: notifications }
  - { name: mobile }
  - { name: backend }

routing:
  cross_vendor_review: true     # reviewer vendor != implementer vendor
  max_gate_attempts: 3          # then the issue is labelled agent-stuck
  fixer_only_lint: true         # fixers retry lint/typecheck only; test failures go back to the implementer
  quota_cooldown: 5h            # a harness whose run fails on a usage/rate limit gets no new work for this long

# Multica runs the agents (see docs/orchestrator-decision.md). fleet sync mirrors
# eligible GitHub issues into it and its state back as labels.
orchestrator:
  kind: multica
  dir: ~/fleet/multica            # clone of multica-ai/multica; compose files live here
  dashboard_bind: 127.0.0.1       # IP for the web UI (:3000) and API (:8080), on this machine: 127.0.0.1 (this machine only) or your tailscale IP (reach it from your phone); never 0.0.0.0
  service_name: fleet-multica     # systemd units: fleet-multica (daemon), fleet-multica-sync.timer
  workspace: widgets              # Multica workspace; created by orchestrator init
  sync_interval: 2m
  owner_email: you@example.com    # lets orchestrator init sign the CLI in with no browser; also restricts Multica sign-up to it

github:
  auth: app                     # app: agents use a scoped GitHub App (fleet github app create/use); gh: the box's personal login, scratch repos only
  isolation: box                # box: the App takes over this machine (dedicated box); project: only this repo, your gh login and git setup stay (weaker boundary)
  app_slug: widgets-fleet       # name of the App fleet registers
  private_key_path: ~/.config/fleet/gh-app.pem
  required_checks: [gate, pr-contract]

notify:
  telegram:                     # optional; names of GitHub Actions secrets, not values
    token_secret: TG_TOKEN
    chat_secret: TG_CHAT
  digest:
    cron: "0 6 * * *"
    tz: UTC

gate:
  command: pnpm gate            # the single command a PR must pass
  timeout: 15m
  workflow: gate                # the GitHub Actions workflow that runs it on PRs; fleet sync counts its failures

labels: {}   # defaults: agent-ready, agent-assist, human-required, needs-human, needs-resource, needs-contract, blocked-by, agent-stuck, fleet-paused
